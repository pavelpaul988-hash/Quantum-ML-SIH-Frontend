<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="HealthQML Login">

    <title>Login | HealthQML</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>


    <!-- BACKGROUND -->

    <div class="page-background">


        <!-- LOGIN CARD -->

        <div class="login-card">


            <!-- LOGO -->

            <a href="index.html"
               class="logo">

                <div class="logo-icon">
                    Q
                </div>

                <div class="logo-name">
                    HealthQML
                </div>

            </a>


            <!-- HEADING -->

            <div class="login-heading">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to continue your health assessment
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- REMEMBER / FORGOT -->

                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>


                <!-- ERROR / SUCCESS MESSAGE -->

                <div
                    id="message"
                    class="message">
                </div>


            </form>


            <!-- DEMO INFORMATION -->

            <div class="demo-box">

                <strong>
                    Demo Login
                </strong>

                <p>
                    Email: demo@healthqml.com
                </p>

                <p>
                    Password: 123456
                </p>

            </div>


            <!-- BACK HOME -->

            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>


        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
